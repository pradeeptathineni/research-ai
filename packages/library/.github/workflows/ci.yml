name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install the pinned private PDF test parser
        run: |
          python3 -m venv "$RUNNER_TEMP/signals-private-documents"
          "$RUNNER_TEMP/signals-private-documents/bin/python" -m pip install --disable-pip-version-check --require-hashes -r requirements-private-documents.txt
          echo "$RUNNER_TEMP/signals-private-documents/bin" >> "$GITHUB_PATH"
      - run: npm run verify
