name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run methods:verify
        env:
          RESEARCH_AI_TYPECHECK_ROOT: ${{ github.workspace }}/node_modules
      - run: npm run typecheck --workspace signals-ai
      - run: npm run build --workspace signals-ai
      - run: npm run workbench:verify
